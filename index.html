        p.className = 'custom-popup ' + (type || 'error');
        p.innerHTML = message;
        document.body.appendChild(p);
        setTimeout(function(){ p.classList.add('show'); }, 20);
        setTimeout(function(){
            p.classList.remove('show');
            p.classList.add('hide');
            setTimeout(function(){ if (p.parentNode) p.remove(); }, 500);
        }, 3500);
    } catch(e) { console.warn("Popup error:", e); }
}

function showToast(msg) {
    try {
        var old = document.querySelector('.toast');
        if (old) old.remove();
        var t = document.createElement('div');
        t.className = 'toast';
        t.innerHTML = msg;
        document.body.appendChild(t);
        setTimeout(function(){ if (t.parentNode) t.remove(); }, 3000);
    } catch(e) {}
}

function linkify(text) {
    if (!text) return '';
    var escaped = String(text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    var urlRegex = /((https?:\/\/[^\s<]+)|(www\.[^\s<]+)|(wa\.me\/[^\s<]+)|(t\.me\/[^\s<]+))/gi;
    return escaped.replace(urlRegex, function(match) {
        var href = match;
        if (/^www\./i.test(match)) href = 'https://' + match;
        else if (/^wa\.me\//i.test(match)) href = 'https://' + match;
        else if (/^t\.me\//i.test(match)) href = 'https://' + match;
        return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="info-link">' + match + '</a>';
    });
}

async function fbSave(path, data) {
    if (!database) { console.warn("No DB"); return false; }
    try {
        var ref = database.ref(path);
        if (Array.isArray(data)) {
            var obj = {};
            data.forEach(function(item){ if (item && item.id) obj[item.id] = item; });
            await ref.set(obj);
        } else {
            await ref.set(data);
        }
        console.log("[OK] Save:", path);
        return true;
    } catch(e) {
        console.error("[ERR] Save " + path + ":", e.message);
        showPopup('<i class="fas fa-exclamation-triangle"></i> Gagal simpan: ' + e.message, 'error');
        return false;
    }
}

function downloadFile(content, name, mime) {
    mime = mime || 'application/octet-stream';
    try {
        var blob;
        if (typeof content === 'string' && content.startsWith('data:')) {
            var bs = atob(content.split(',')[1]);
            var mt = content.split(',')[0].split(':')[1].split(';')[0];
            var ab = new ArrayBuffer(bs.length);
            var ia = new Uint8Array(ab);
            for (var i=0; i<bs.length; i++) ia[i] = bs.charCodeAt(i);
            blob = new Blob([ab], {type: mt});
        } else {
            blob = new Blob([content], {type: mime});
        }
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); if (a.parentNode) a.remove(); }, 200);
    } catch(e){ showPopup('<i class="fas fa-times-circle"></i> Gagal download', 'error'); }
}

function doEmailRegister() {
    var file = document.getElementById('regAvatar').files[0];
    var email = document.getElementById('regEmail').value.trim();
    var username = document.getElementById('regUsername').value.trim();
    var password = document.getElementById('regPassword').value.trim();
    var confirm = document.getElementById('regConfirm').value.trim();
    if (!email || !username || !password) return showPopup('<i class="fas fa-exclamation-triangle"></i> Semua field harus diisi!', 'error');
    if (password !== confirm) return showPopup('<i class="fas fa-times-circle"></i> Password tidak sama!', 'error');
    if (!email.endsWith('@gmail.com')) return showPopup('<i class="fas fa-envelope"></i> Wajib menggunakan email resmi atau dengan domain @gmail.com', 'error');
    if (appData.users.find(function(u){ return u && u.username.toLowerCase() === username.toLowerCase(); }))
        return showPopup('<i class="fas fa-user-times"></i> Username ini sudah digunakan gunakan username lain', 'error');
    if (appData.users.find(function(u){ return u && u.email.toLowerCase() === email.toLowerCase(); }))
        return showPopup('<i class="fas fa-envelope"></i> Email ini sudah digunakan gunakan email lain', 'error');
    
    var doSave = function(av) {
        if (auth) {
            try { auth.createUserWithEmailAndPassword(email, password).catch(function(err){ console.warn("Auth:", err.message); }); } catch(e){}
        }
        var nu = {
            id: Date.now().toString(), email: email, username: username,
            password: password, role: 'user', avatar: av || '',
            coins: 0, isBanned: false, hasPassword: true, provider: 'email'
        };
        appData.users.push(nu);
        fbSaveUser(nu).then(function(ok){
            if (ok) {
                showPopup('<i class="fas fa-check-circle"></i> Pendaftaran berhasil silahkan login dengan akun anda', 'success');
                setTimeout(showLoginForm, 500);
            }
        });
    };
    
    if (file) {
        var r = new FileReader();
        r.onload = function(e){ doSave(e.target.result); };
        r.readAsDataURL(file);
    } else doSave('');
}

async function doGoogleLogin() {
    if (!auth) return showPopup('<i class="fas fa-times-circle"></i> Firebase Auth tidak tersedia', 'error');
    try {
        var provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
        if (isMobile) {
            await auth.signInWithRedirect(provider);
            return;
        }
        var result = await auth.signInWithPopup(provider);
        await handleGoogleUser(result.user);
    } catch(e) {
        console.warn("Google err:", e);
        if (e.code === 'auth/popup-closed-by-user') showPopup('<i class="fas fa-times-circle"></i> Login dibatalkan', 'error');
        else if (e.code === 'auth/operation-not-allowed') showPopup('<i class="fas fa-times-circle"></i> Google Auth belum aktif', 'error');
        else if (e.code === 'auth/unauthorized-domain') showPopup('<i class="fas fa-times-circle"></i> Domain belum diizinkan', 'error');
        else showPopup('<i class="fas fa-times-circle"></i> Gagal: ' + (e.message||'unknown'), 'error');
    }
}

async function handleGoogleUser(guser) {
    var email = guser.email;
    var gname = email.split('@')[0];
    var photo = guser.photoURL || '';
    var existing = appData.users.find(function(u){ return u && u.email.toLowerCase() === email.toLowerCase(); });
    if (existing) {
        if (existing.isBanned) { await auth.signOut(); showPopup('<i class="fas fa-ban"></i> User dibanned!', 'error'); return; }
        currentUser = existing;
        if (!existing.avatar && photo) { existing.avatar = photo; await fbSaveUser(existing); }
        rememberMe = true;
        saveSession();
        showPopup('<i class="fas fa-hand-peace"></i> Halo ' + existing.username + '!', 'success');
        setTimeout(render, 500);
    } else {
        var nu = {
            id: guser.uid || Date.now().toString(),
            email: email, username: gname, password: '',
            role: 'user', avatar: photo, coins: 0, isBanned: false,
            hasPassword: false, provider: 'google'
        };
        appData.users.push(nu);
        var ok = await fbSaveUser(nu);
        if (!ok) return;
        currentUser = nu;
        rememberMe = true;
        saveSession();
        showPopup('<i class="fas fa-check-circle"></i> Berhasil daftar dengan Google!', 'success');
        setTimeout(render, 500);
    }
}

            var b = notificationStates[it.id] ? '<span class="notification-badge"></span>' : '';
            return '<button class="nav-item ' + a + ' ' + i + '" data-menu="' + it.id + '"><span>' + it.icon + '</span><span>' + it.label + '</span>' + b + '</button>';
        }).join('') + '</div>';
        document.querySelectorAll('.nav-item').forEach(function(btn){
            btn.onclick = function() {
                notificationStates[btn.dataset.menu] = false;
                currentMenu = btn.dataset.menu;
                renderMain();
            };
        });
    }

    var role = '';
    if (currentUser.role === 'developer') role = '<span class="developer-badge"><i class="fas fa-code"></i> DEV</span>';
    else if (currentUser.role === 'admin') role = '<span class="developer-badge" style="background:#00ffff;"><i class="fas fa-crown"></i> ADMIN</span>';

    if (main) {
        main.innerHTML = '<div class="app-header"><h2 class="neon-text"><i class="fas fa-store"></i> WannShop ' + role + '</h2>' +
            '<div class="header-buttons">' +
            '<div class="sync-status"><span class="sync-dot"></span> <i class="fas fa-fire"></i> ' + (isFirebaseConnected?'Online':'Offline') + '</div>' +
            '<button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> LOGOUT</button>' +
            '</div></div><div id="mainContent"></div>';
        document.getElementById('logoutBtn').onclick = async function() {
            try { if (auth) await auth.signOut(); } catch(e){}
            currentUser = null;
            try { localStorage.removeItem('wann_session'); } catch(e){}
            render();
        };
    }
    renderContent();
}

function renderContent() {
    var c = document.getElementById('mainContent');
    if (!c) return;
    try {
        if (currentMenu === 'beranda') c.innerHTML = viewBeranda();
        else if (currentMenu === 'produk') c.innerHTML = viewProduk();
        else if (currentMenu === 'history') c.innerHTML = viewHistory();
        else if (currentMenu === 'publichistory') c.innerHTML = viewPublicHistory();
        else if (currentMenu === 'profil') c.innerHTML = viewProfil();
        else if (currentMenu === 'coin') c.innerHTML = viewCoin();
        else if (currentMenu === 'admin') c.innerHTML = viewAdmin();
        else if (currentMenu === 'info') c.innerHTML = viewInfo();
        else c.innerHTML = '<div style="padding:2rem;text-align:center;">Halaman tidak ditemukan</div>';
        if (currentMenu === 'info') renderInfoMessages();
        initTextareas();
        bindContentEvents();
    } catch(e) {
        console.warn("renderContent err:", e);
        c.innerHTML = '<div style="padding:2rem;text-align:center;color:#ff8888;">Error: ' + e.message + '</div>';
    }
}

function initTextareas() {
    document.querySelectorAll('.auto-expand-textarea').forEach(function(t){
        if (t._init) return;
        t._init = true;
        var adj = function(){ t.style.height='auto'; t.style.height = Math.min(t.scrollHeight,150)+'px'; };
        t.addEventListener('input', adj);
        setTimeout(adj, 10);
    });
}

function bindContentEvents() {
    document.querySelectorAll('.btn-hapus-info').forEach(function(b){
        b.onclick = async function() {
            if (!confirm('Hapus informasi ini? Akan hilang dari semua perangkat.')) return;
            var id = b.dataset.id;
            appData.infoMessages = appData.infoMessages.filter(function(m){ return m && m.id !== id; });
            var ok = await fbSave('infoMessages', appData.infoMessages);
            if (ok) {
                showPopup('<i class="fas fa-check-circle"></i> Informasi dihapus!', 'success');
                render();
            }
        };
    });

    var smBtn = document.getElementById('startMaintenanceBtn');
    if (smBtn) smBtn.onclick = function() {
        var m = document.createElement('div');
        m.className = 'modal-overlay';
        m.innerHTML = '<div class="modal-content">' +
            '<h3><i class="fas fa-tools"></i> MAINTENANCE</h3>' +
            '<p style="font-size:12px;opacity:.7;margin-bottom:10px;">Isi data di bawah. Setelah disimpan, website akan masuk mode maintenance untuk semua user (kecuali developer).</p>' +
            '<div class="form-group"><label>Foto</label><input type="file" id="mFoto" accept="image/*" class="neon-input"></div>' +
            '<div class="form-group"><label>Nama</label><input type="text" id="mNama" class="neon-input" placeholder="Nama Anda"></div>' +
            '<div class="form-group"><label>Link</label><input type="text" id="mLink" class="neon-input" placeholder="https://wa.me/..."></div>' +
            '<button class="btn-primary" id="saveM"><i class="fas fa-save"></i> AKTIFKAN MAINTENANCE</button>' +
            '<button class="btn-primary" id="closeM" style="background:#666;margin-top:8px;"><i class="fas fa-times"></i> Batal</button>' +
            '</div>';
        document.body.appendChild(m);
        document.getElementById('saveM').onclick = function() {
            var file = document.getElementById('mFoto').files[0];
            var nama = document.getElementById('mNama').value.trim();
            var link = document.getElementById('mLink').value.trim();
            if (!nama) return showPopup('<i class="fas fa-exclamation-triangle"></i> Nama wajib diisi!', 'error');
            if (!link) return showPopup('<i class="fas fa-exclamation-triangle"></i> Link wajib diisi!', 'error');
            
            var doSave = async function(fotoData) {
                var data = { active: true, foto: fotoData || '', nama: nama, link: link };
                var ok = await fbSave('maintenance', data);
                if (ok) {
                    maintenanceData = data;
                    showPopup('<i class="fas fa-check-circle"></i> Maintenance diaktifkan!', 'success');
                    m.remove();
                    checkMaintenance();
                    render();
                }
            };
            
            if (file) {
                var r = new FileReader();
                r.onload = function(e){ doSave(e.target.result); };
                r.readAsDataURL(file);
            } else doSave('');
        };
        document.getElementById('closeM').onclick = function(){ m.remove(); };
    };

    var rmBtn = document.getElementById('releaseMaintenanceBtn');
    if (rmBtn) rmBtn.onclick = async function() {
        if (!confirm('Lepas maintenance? Website kembali normal.')) return;
        var data = { active: false, foto: '', nama: '', link: '' };
        var ok = await fbSave('maintenance', data);
        if (ok) {
            maintenanceData = data;
            showPopup('<i class="fas fa-check-circle"></i> Maintenance dilepas!', 'success');
            checkMaintenance();
            render();
        }
    };

    document.querySelectorAll('.buy-btn').forEach(function(b){
        b.onclick = async function() {
            var prod = appData.products.find(function(p){ return p && p.id === b.dataset.id; });
            if (!prod) return showPopup('<i class="fas fa-times-circle"></i> Produk tidak ditemukan', 'error');
            if (prod.stok <= 0) return showPopup('<i class="fas fa-box-open"></i> Stok habis!', 'error');
            if (currentUser.coins < prod.hargaCoin) return showPopup('<i class="fas fa-coins"></i> Coin tidak cukup!', 'error');
            currentUser.coins -= prod.hargaCoin;
            prod.stok--;
            var idx = appData.users.findIndex(function(u){ return u && u.id === currentUser.id; });
            if (idx !== -1) appData.users[idx] = currentUser;
            await fbSaveUser(currentUser);
            await fbSave('products', appData.products);
            var tid = 'WANN' + Date.now();
            var struk = genStruk(prod, currentUser.username, tid);
            
            if (prod.tipe === 'link' && prod.link) {
                window.open(prod.link, '_blank');
                showPopup('<i class="fas fa-check-circle"></i> Link produk dibuka!', 'success');
            } else if (prod.fileData) {
                var ext = prod.fileName ? prod.fileName.split('.').pop() : 'bin';
                downloadFile(prod.fileData, 'WannShop-' + (prod.nomor||'x') + '.' + ext);
            } else {
                downloadFile(struk, 'STRUK_' + prod.nama + '.txt', 'text/plain');
            }
            
            var h = getHistory();
            h.push({
                productId: prod.id, productName: prod.nama, productNomor: prod.nomor,
                price: prod.hargaCoin, date: new Date().toLocaleString(),
                transactionId: tid, strukContent: struk,
                fileData: prod.fileData || null, fileName: prod.fileName || '',
                tipe: prod.tipe || 'file', link: prod.link || ''
            });
            saveHistory(h);
            appData.publicHistory.push({
                id: Date.now().toString(), username: currentUser.username,
                productName: prod.nama, productNomor: prod.nomor,
                date: new Date().toLocaleString(), transactionId: tid
            });
            await fbSave('publicHistory', appData.publicHistory);
            render();
        };
    });

    document.querySelectorAll('.dl-struk').forEach(function(b){
        b.onclick = function() {
            var h = getHistory();
            var it = h[parseInt(b.dataset.idx)];
            if (it) downloadFile(it.strukContent||'', 'STRUK_' + it.productName + '.txt', 'text/plain');
        };
    });
    document.querySelectorAll('.dl-file').forEach(function(b){
        b.onclick = function() {

                    if (!nm.bankName || !nm.accountNumber) return showPopup('<i class="fas fa-exclamation-triangle"></i> Lengkapi!', 'error');

                    nm.platform = document.getElementById('pPlat').value;
                    nm.number = document.getElementById('pNum').value.trim();
                    nm.name = document.getElementById('pEName').value.trim();
                    if (!nm.number) return showPopup('<i class="fas fa-exclamation-triangle"></i> Isi nomor!', 'error');
                } else {
                    nm.contactLink = document.getElementById('pLink').value.trim();
                    nm.name = document.getElementById('pMName').value.trim() || 'Admin';
                    if (!nm.contactLink) return showPopup('<i class="fas fa-exclamation-triangle"></i> Isi link!', 'error');
                }
                appData.paymentMethods.push(nm);
                fbSave('paymentMethods', appData.paymentMethods);
                showPopup('<i class="fas fa-check-circle"></i> Metode ditambah!', 'success');
                m.remove();
                render();
            };
            document.getElementById('closePay').onclick = function(){ m.remove(); };
        };

        document.querySelectorAll('.delete-payment-btn').forEach(function(b){
            b.onclick = function() {
                if (confirm('Hapus metode?')) {
                    appData.paymentMethods = appData.paymentMethods.filter(function(m){ return m && m.id !== b.dataset.id; });
                    fbSave('paymentMethods', appData.paymentMethods);
                    showPopup('<i class="fas fa-check-circle"></i> Dihapus!', 'success');
                    render();
                }
            };
        });

        document.querySelectorAll('.approve-btn').forEach(function(b){
            b.onclick = function() {
                var t = appData.transactions.find(function(x){ return x && x.id === b.dataset.id; });
                if (t) {
                    t.status = 'approved';
                    var u = appData.users.find(function(x){ return x && x.id === t.userId; });
                    if (u) { u.coins += t.coins; fbSaveUser(u); }
                    fbSave('transactions', appData.transactions);
                    showPopup('<i class="fas fa-check-circle"></i> Top up disetujui!', 'success');
                    render();
                }
            };
        });
        document.querySelectorAll('.reject-btn').forEach(function(b){
            b.onclick = function() {
                var t = appData.transactions.find(function(x){ return x && x.id === b.dataset.id; });
                if (t) {
                    t.status = 'rejected';
                    fbSave('transactions', appData.transactions);
                    showPopup('<i class="fas fa-times-circle"></i> Top up ditolak!', 'error');
                    render();
                }
            };
        });

        var sib = document.getElementById('sendInfoBtn');
        if (sib && isDev()) sib.onclick = function() {
            var title = document.getElementById('infoTitle').value.trim();
            var msg = document.getElementById('infoMessage').value.trim();
            if (!title || !msg) return showPopup('<i class="fas fa-exclamation-triangle"></i> Lengkapi!', 'error');
            appData.infoMessages.push({
                id: Date.now().toString(), title: title, message: msg,
                timestamp: new Date().toISOString(), from: currentUser.username
            });
            fbSave('infoMessages', appData.infoMessages);
            showPopup('<i class="fas fa-check-circle"></i> Info dikirim!', 'success');
            render();
        };
    }

    if (isDev()) {
        document.querySelectorAll('.add-coin-btn').forEach(function(b){
            b.onclick = function() {
                var amt = prompt('Jumlah coin:');
                if (amt && !isNaN(amt) && parseInt(amt) > 0) {
                    var u = appData.users.find(function(x){ return x && x.id === b.dataset.id; });
                    if (u) {
                        u.coins += parseInt(amt);
                        fbSaveUser(u);
                        showPopup('<i class="fas fa-check-circle"></i> +' + amt + ' coin', 'success');
                        render();
                    }
                }
            };
        });
        document.querySelectorAll('.ban-user-btn').forEach(function(b){
            b.onclick = function() {
                if (confirm('Ban user?')) {
                    var u = appData.users.find(function(x){ return x && x.id === b.dataset.id; });
                    if (u && u.role !== 'developer') {
                        u.isBanned = true;
                        fbSaveUser(u);
                        showPopup('<i class="fas fa-ban"></i> User di-ban!', 'success');
                        render();
                    }
                }
            };
        });
        document.querySelectorAll('.delete-user-btn').forEach(function(b){
            b.onclick = function() {
                if (confirm('Hapus user?')) {
                    var u = appData.users.find(function(x){ return x && x.id === b.dataset.id; });
                    if (u && u.role !== 'developer') {
                        appData.users = appData.users.filter(function(x){ return x && x.id !== b.dataset.id; });
                        database.ref('users/' + b.dataset.id).remove();
                        showPopup('<i class="fas fa-trash"></i> User dihapus!', 'success');
                        render();
                    }
                }
            };
        });
    }
}

function openChatPanel() {
    document.getElementById('chatPanel').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('bottomNavWrapper').classList.add('hidden');
    document.getElementById('chatFab').classList.add('hidden');
    currentChatView = 'users';
    renderChatPanel();
}
function closeChatPanel() {
    document.getElementById('chatPanel').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    document.getElementById('bottomNavWrapper').classList.remove('hidden');
    document.getElementById('chatFab').classList.remove('hidden');
    currentChatTarget = null;
    render();
}

function renderChatPanel() {
    var p = document.getElementById('chatPanel');
    p.innerHTML = '<div class="chat-header"><button id="closeChatBtn"><i class="fas fa-arrow-left"></i></button>' +
        '<h3 style="font-size:1rem;flex:1;"><i class="fas fa-comments"></i> WannShop CHAT</h3>' +
        '<button id="homeChatBtn"><i class="fas fa-home"></i></button></div>' +
        '<div class="chat-tabs">' +
        '<button class="chat-tab ' + (currentChatView==='users'?'active':'') + '" data-view="users"><i class="fas fa-users"></i> Cari</button>' +
        '<button class="chat-tab ' + (currentChatView==='inbox'?'active':'') + '" data-view="inbox"><i class="fas fa-inbox"></i> Inbox</button>' +
        '<button class="chat-tab ' + (currentChatView==='developer'?'active':'') + '" data-view="developer"><i class="fas fa-code"></i> Dev</button>' +
        '</div><div id="chatContent" class="chat-content"></div>';
    document.getElementById('closeChatBtn').onclick = closeChatPanel;
    document.getElementById('homeChatBtn').onclick = closeChatPanel;
    document.querySelectorAll('.chat-tab').forEach(function(t){
        t.onclick = function() {
            currentChatView = t.dataset.view;
            if (currentChatView === 'developer') {
                var d = appData.users.find(function(u){ return u && u.role === 'developer'; });
                if (d) { currentChatTarget = d.id; currentChatView = 'chat'; }
            }
            renderChatPanel();
        };
    });
    renderChatContent();
}

function renderChatContent() {
    var c = document.getElementById('chatContent');
    if (!c) return;
    if (currentChatView === 'users') {
        var us = appData.users.filter(function(u){ return u && u.id !== currentUser.id; });
        c.innerHTML = us.length ? us.map(function(u){
            return '<div class="user-item-chat"><div class="user-info">' +
                (u.avatar ? '<img src="' + u.avatar + '" class="user-avatar">' : '<div class="user-avatar"><i class="fas fa-user"></i></div>') +
                '<div><strong>' + u.username + '</strong><br><span style="font-size:10px;opacity:.6;">' + u.email + '</span></div>' +
                '</div><button class="btn-primary btn-small chat-start" data-id="' + u.id + '"><i class="fas fa-paper-plane"></i> Kirim</button></div>';
        }).join('') : '<p style="text-align:center;padding:2rem;opacity:.5;">Tidak ada user</p>';
        document.querySelectorAll('.chat-start').forEach(function(b){
            b.onclick = function(){ currentChatTarget = b.dataset.id; currentChatView = 'chat'; renderChatPanel(); };
        });
    } else if (currentChatView === 'inbox') {
        var convos = {};
        appData.messages.forEach(function(m){
            if (m.from === currentUser.id) convos[m.to] = 1;
            else if (m.to === currentUser.id) convos[m.from] = 1;
        });
        var ids = Object.keys(convos);
        c.innerHTML = ids.length ? ids.map(function(uid){
            var u = appData.users.find(function(x){ return x && x.id === uid; });
            if (!u) return '';
            return '<div class="user-item-chat"><div class="user-info">' +
                (u.avatar ? '<img src="' + u.avatar + '" class="user-avatar">' : '<div class="user-avatar"><i class="fas fa-user"></i></div>') +
                '<div><strong>' + u.username + '</strong></div></div>' +
                '<button class="btn-primary btn-small open-chat" data-id="' + u.id + '"><i class="fas fa-comment"></i> Buka</button></div>';
        }).join('') : '<p style="text-align:center;padding:2rem;opacity:.5;">Belum ada pesan</p>';
        document.querySelectorAll('.open-chat').forEach(function(b){
            b.onclick = function(){ currentChatTarget = b.dataset.id; currentChatView = 'chat'; renderChatPanel(); };
        });
    } else if (currentChatView === 'chat' && currentChatTarget) {
        var tu = appData.users.find(function(u){ return u && u.id === currentChatTarget; });
        if (!tu) { c.innerHTML = '<p style="padding:2rem;">User tidak ditemukan</p>'; return; }
        var msgs = appData.messages.filter(function(m){
            return (m.from === currentUser.id && m.to === tu.id) || (m.from === tu.id && m.to === currentUser.id);
        }).sort(function(a,b){ return new Date(a.timestamp) - new Date(b.timestamp); });
        c.innerHTML = '<h3 style="margin-bottom:10px;font-size:1rem;"><i class="fas fa-comment-dots"></i> ' + tu.username + '</h3>' +
            '<div id="msgList" style="max-height:50vh;overflow-y:auto;margin-bottom:10px;">' +
            (msgs.length ? msgs.map(function(m){
                var ct = '';
                if (m.type === 'text') ct = m.content;
                else if (m.type === 'image') ct = '<img src="' + m.content + '" class="chat-image" onclick="showFullscreenImage(\'' + m.content + '\', \'' + (m.fileName||'img') + '\')">';
                else if (m.type === 'video') ct = '<video src="' + m.content + '" controls style="max-width:100%;border-radius:12px;"></video>';
                else if (m.type === 'file') ct = '<a href="' + m.content + '" download="' + m.fileName + '"><i class="fas fa-file-download"></i> ' + m.fileName + '</a>';
                return '<div class="' + (m.from === currentUser.id ? 'message-right' : 'message-left') + '">' +
                    '<div class="' + (m.from === currentUser.id ? 'message-bubble-right' : 'message-bubble-left') + '">' +
                    '<div class="message-sender">' + (m.from === currentUser.id ? 'Anda' : tu.username) + '</div>' +
                    '<div>' + ct + '</div>' +
                    '<div class="message-time">' + new Date(m.timestamp).toLocaleTimeString() + '</div></div></div>';
            }).join('') : '<p style="text-align:center;padding:1rem;opacity:.5;">Belum ada pesan</p>') + '</div>' +
            '<div class="chat-input-area">' +
            '<input type="text" id="chatIn" placeholder="Pesan...">' +
            '<div class="media-buttons">' +
            '<button id="sPic" class="media-btn"><i class="fas fa-image"></i></button>' +
            '<button id="sVid" class="media-btn"><i class="fas fa-video"></i></button>' +
            '<button id="sFile" class="media-btn"><i class="fas fa-file"></i></button>' +
            '</div><button id="sMsg" class="btn-primary btn-small" style="width:auto;padding:6px 14px;"><i class="fas fa-paper-plane"></i></button></div>';
        var send = function(type, content, fn) {
            appData.messages.push({
                id: Date.now().toString(), from: currentUser.id, to: tu.id,
                type: type, content: content, fileName: fn || '',
                timestamp: new Date().toISOString(), read: false
            });
            fbSave('messages', appData.messages);
            renderChatContent();
        };
        var inp = document.getElementById('chatIn');
        var doText = function() {
            var t = inp.value.trim();
            if (t) { send('text', t); inp.value = ''; renderChatContent(); }
        };
        document.getElementById('sMsg').onclick = doText;
        inp.onkeydown = function(e){ if (e.key === 'Enter') { e.preventDefault(); doText(); } };
        document.getElementById('sPic').onclick = function(){ pickFile('image/*', function(f){ send('image', f.data, f.name); }); };
        document.getElementById('sVid').onclick = function(){ pickFile('video/*', function(f){ send('video', f.data, f.name); }); };
        document.getElementById('sFile').onclick = function(){ pickFile('*/*', function(f){ send('file', f.data, f.name); }); };
        var ml = document.getElementById('msgList');
        if (ml) setTimeout(function(){ ml.scrollTop = ml.scrollHeight; }, 50);
    }
}

function pickFile(accept, cb) {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept;
    inp.onchange = function(e) {
        var f = e.target.files[0];
        if (!f) return;
        var r = new FileReader();
        r.onload = function(ev){ cb({data: ev.target.result, name: f.name}); };
        r.readAsDataURL(f);
    };
    inp.click();
}

window.showFullscreenImage = function(url, name) {
    var v = document.createElement('div');
    v.className = 'image-viewer';
    v.innerHTML = '<div class="image-viewer-header"><button id="clvImg"><i class="fas fa-arrow-left"></i> Kembali</button>' +
        '<button id="dlvImg"><i class="fas fa-download"></i> Download</button></div>' +
        '<div class="image-viewer-content"><img src="' + url + '"></div>';
    document.body.appendChild(v);
    document.getElementById('clvImg').onclick = function(){ v.remove(); };
    document.getElementById('dlvImg').onclick = function() {
        var a = document.createElement('a');
        a.href = url; a.download = name || 'foto.jpg'; a.click();
        showToast('<i class="fas fa-check-circle"></i> Download dimulai');
    };
    v.onclick = function(e){ if (e.target === v) v.remove(); };
};

(async function() {
    try {
        if (auth) {
            try {
                var redirectResult = await auth.getRedirectResult();
                if (redirectResult && redirectResult.user) {
                    await handleGoogleUser(redirectResult.user);
                }
            } catch(e) { console.warn("Redirect result err:", e); }
        }
        
        await fbLoad();
        if (database) setupListeners();
        loadSession();
        render();
        checkMaintenance();
        setTimeout(function(){ if (currentMenu === 'info') renderInfoMessages(); }, 500);
    } catch(e) {
        console.error("[FATAL]", e);
        resetDefault();
        render();
    }
})();
