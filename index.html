// ==================== AUTO-EXPAND TEXTAREA ====================
function autoExpandTextarea(textarea) {
    if (!textarea) return;
    textarea.style.height = 'auto';
    let newHeight = Math.min(textarea.scrollHeight, 150);
    textarea.style.height = newHeight + 'px';
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        let height = Math.min(this.scrollHeight, 150);
        this.style.height = height + 'px';
    });
    textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            let start = this.selectionStart;
            let end = this.selectionEnd;
            this.value = this.value.substring(0, start) + '\n' + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 1;
            this.dispatchEvent(new Event('input'));
        }
    });
}

function initAutoExpandTextareas() {
    document.querySelectorAll('.auto-expand-textarea').forEach(textarea => { autoExpandTextarea(textarea); });

// ==================== FIREBASE HELPERS ====================
async function saveToFirebase(path, data) {
    if (!database) return;
    const ref = database.ref(path);
    if (Array.isArray(data)) {
        const obj = {};
        data.forEach(item => { obj[item.id] = item; });
        await ref.set(obj);
    } else await ref.set(data);
}

async function loadFromFirebase() {
    if (!database) return;
    let snap = await database.ref('users').once('value');
    appData.users = snap.val() ? Object.values(snap.val()) : defaultUsers;
    if (!snap.val()) await saveToFirebase('users', defaultUsers);
    snap = await database.ref('products').once('value');
    appData.products = snap.val() ? Object.values(snap.val()) : [];
    snap = await database.ref('paymentMethods').once('value');
    appData.paymentMethods = snap.val() ? Object.values(snap.val()) : defaultPaymentMethods;
    snap = await database.ref('transactions').once('value');
    appData.transactions = snap.val() ? Object.values(snap.val()) : [];
    snap = await database.ref('publicHistory').once('value');
    appData.publicHistory = snap.val() ? Object.values(snap.val()) : [];
    snap = await database.ref('reviews').once('value');
    appData.reviews = snap.val() ? Object.values(snap.val()) : [];
    snap = await database.ref('messages').once('value');
    appData.messages = snap.val() ? Object.values(snap.val()) : [];
    snap = await database.ref('meta/productCounter').once('value');
    appData.productCounter = snap.val() || 1;
    snap = await database.ref('userLocations').once('value');
    appData.userLocations = snap.val() ? Object.values(snap.val()) : [];
}

function setupFirebaseListeners() {
    if (!database) return;
    let oldProductsLength = appData.products.length;
    let oldMessagesLength = appData.messages.length;
    let oldPublicHistoryLength = appData.publicHistory.length;
    let oldReviewsLength = appData.reviews.length;
    
    database.ref('products').on('value', s => { 
        if (s.val()) { 
            let newLength = Object.values(s.val()).length;
            if (newLength > oldProductsLength) notificationStates.produk = true;
            if (newLength !== oldProductsLength) updateNotificationBadges();
            oldProductsLength = newLength;
            appData.products = Object.values(s.val()); 
            render(); 
        } 
    });
    database.ref('messages').on('value', s => { 
        if (s.val()) { 
            let newLength = Object.values(s.val()).length;
            if (newLength > oldMessagesLength && currentMenu !== 'chat') notificationStates.chat = true;
            if (newLength !== oldMessagesLength) updateNotificationBadges();
            oldMessagesLength = newLength;
            appData.messages = Object.values(s.val()); 
            if (document.getElementById('chatPanel') && !document.getElementById('chatPanel').classList.contains('hidden')) renderChatContent(); 
            render(); 
        } 
    });
    database.ref('publicHistory').on('value', s => { 
        if (s.val()) { 
            let newLength = Object.values(s.val()).length;

            oldPublicHistoryLength = newLength;
            appData.publicHistory = Object.values(s.val()); 
            render(); 
        } 
    });
    database.ref('reviews').on('value', s => { 
        if (s.val()) { 
            let newLength = Object.values(s.val()).length;
            if (newLength > oldReviewsLength) notificationStates.history = true;
            if (newLength !== oldReviewsLength) updateNotificationBadges();
            oldReviewsLength = newLength;
            appData.reviews = Object.values(s.val()); 
            render(); 
        } 
    });
    database.ref('users').on('value', s => { if (s.val()) { appData.users = Object.values(s.val()); if (currentUser) { let u = appData.users.find(u => u.id === currentUser.id); if (u) currentUser = u; } render(); } });

    database.ref('userLocations').on('value', s => { if (s.val()) appData.userLocations = Object.values(s.val()); });
}

// ==================== UTILITIES ====================
function showToast(msg, isErr = false) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    t.style.background = isErr ? '#ff3366' : '#00ffff';
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}

function downloadFile(content, name, mime = 'application/octet-stream') {
    let blob;
    if (content && content.startsWith('data:')) {
        const byteString = atob(content.split(',')[1]);
        const mimeType = content.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        blob = new Blob([ab], { type: mimeType });
    } else blob = new Blob([content], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
}

function getPurchaseHistory() { return JSON.parse(localStorage.getItem('purchaseHistory_' + currentUser?.id) || '[]'); }
function savePurchaseHistory(h) { localStorage.setItem('purchaseHistory_' + currentUser.id, JSON.stringify(h)); }
function isAdmin() { return currentUser && (currentUser.role === 'admin' || currentUser.role === 'developer'); }
function isDeveloper() { return currentUser && currentUser.role === 'developer'; }

async function sendNotificationToAllUsers(title, message) {
    const users = appData.users;
    for (const user of users) {
        if (user.id !== currentUser.id) {
            const userNotifRef = database.ref(`userNotifications/${user.id}`);
            const notifData = { id: Date.now().toString(), title, message, timestamp: new Date().toISOString() };
            const existing = await userNotifRef.once('value');
            let notifs = existing.val() || [];
            notifs.push(notifData);
            await userNotifRef.set(notifs);
        }
    }
    showToast(`✅ Notifikasi dikirim ke ${users.length - 1} user`);
}

function saveUserSession(user) {
    if (rememberMe) {
        localStorage.setItem('wann_remember_user', JSON.stringify({
            id: user.id, email: user.email, username: user.username,
            role: user.role, avatar: user.avatar, coins: user.coins, isBanned: user.isBanned
        }));
    } else { localStorage.removeItem('wann_remember_user'); }
}

function loadUserSession() {
    const saved = localStorage.getItem('wann_remember_user');
    if (saved) {
        try {
            const user = JSON.parse(saved);
            const freshUser = appData.users.find(u => u.id === user.id);
            if (freshUser && !freshUser.isBanned) { currentUser = freshUser; return true; }
        } catch(e) {}
    }
    return false;
}

// ==================== CHAT FUNCTIONS ====================
function sendMessage(toUserId, type, content, fileName = '') {
    if (!currentUser) return;
    const msg = { id: Date.now().toString(), from: currentUser.id, to: toUserId, type, content, fileName, timestamp: new Date().toISOString(), read: false };
    appData.messages.push(msg);
    saveToFirebase('messages', appData.messages);
    renderChatContent();
}

function getChatsWithUser(userId) {
    return appData.messages.filter(m => (m.from === currentUser.id && m.to === userId) || (m.from === userId && m.to === currentUser.id)).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
}

function getAllConversations() {
    const usersMap = new Map();
    appData.messages.forEach(m => {
        if (m.from === currentUser.id) usersMap.set(m.to, m);
        else if (m.to === currentUser.id) usersMap.set(m.from, m);
    });
    return Array.from(usersMap.keys()).map(uid => appData.users.find(u => u.id === uid)).filter(u => u);
}

function startChatWith(userId) { 
    currentChatTarget = userId; 
    currentChatView = 'chat'; 
    clearNotification('chat');
    renderChatContent(); 
}

function renderChatContent() {
    const contentDiv = document.getElementById('chatContent');
    if (!contentDiv) return;
    if (currentChatView === 'users') {
        const users = appData.users.filter(u => u.id !== currentUser.id);
        contentDiv.innerHTML = users.map(u => `<div class="user-item-chat"><div class="user-info" style="display:flex; align-items:center; gap:12px;">${u.avatar ? `<img src="${u.avatar}" class="user-avatar">` : `<div class="user-avatar" style="display:flex; align-items:center; justify-content:center;"><i class="fas fa-user"></i></div>`}<div><strong>${u.username}</strong><br><span style="font-size:11px;">${u.email}</span></div></div><button class="btn-primary btn-small chat-start-btn" data-id="${u.id}" style="width:auto; padding:6px 12px;"><i class="fas fa-paper-plane"></i> Kirim</button></div>`).join('');
        document.querySelectorAll('.chat-start-btn').forEach(btn => { btn.onclick = () => startChatWith(btn.dataset.id); });
    } else if (currentChatView === 'inbox') {
        const convos = getAllConversations();
        contentDiv.innerHTML = convos.map(u => `<div class="user-item-chat"><div class="user-info" style="display:flex; align-items:center; gap:12px;">${u.avatar ? `<img src="${u.avatar}" class="user-avatar">` : `<div class="user-avatar"><i class="fas fa-user"></i></div>`}<div><strong>${u.username}</strong></div></div><button class="btn-primary btn-small open-chat-btn" data-id="${u.id}" style="width:auto; padding:6px 12px;"><i class="fas fa-comment"></i> Buka</button></div>`).join('');
        document.querySelectorAll('.open-chat-btn').forEach(btn => { btn.onclick = () => startChatWith(btn.dataset.id); });
    } else if (currentChatView === 'chat' && currentChatTarget) {
        const targetUser = appData.users.find(u => u.id === currentChatTarget);
        if (targetUser) {
            const messages = getChatsWithUser(targetUser.id);
            contentDiv.innerHTML = `<h3><i class="fas fa-comment-dots"></i> Chat dengan ${targetUser.username}</h3><div id="messageList" style="margin-bottom:10px; max-height:60vh; overflow-y:auto;">${messages.map(m => {
                let contentHtml = '';
                if (m.type === 'text') contentHtml = m.content;
                else if (m.type === 'image') contentHtml = `<img src="${m.content}" class="chat-image" onclick="showFullscreenImage('${m.content}', '${m.fileName || 'foto_wanshop.jpg'}')">`;
                else if (m.type === 'video') contentHtml = `<video src="${m.content}" controls style="max-width:100%; border-radius:12px;"></video>`;
                else if (m.type === 'file') contentHtml = `<a href="${m.content}" download="${m.fileName}"><i class="fas fa-file-download"></i> ${m.fileName}</a>`;
                return `<div class="${m.from === currentUser.id ? 'message-right' : 'message-left'}"><div class="${m.from === currentUser.id ? 'message-bubble-right' : 'message-bubble-left'}"><div class="message-sender">${m.from === currentUser.id ? 'Anda' : targetUser.username}</div><div>${contentHtml}</div><div class="message-time">${new Date(m.timestamp).toLocaleTimeString()}</div></div></div>`;
            }).join('')}</div><div class="chat-input-area"><input type="text" id="chatInput" class="neon-input" placeholder="Pesan..." style="flex:1;"><div class="media-buttons"><button id="sendPhotoBtn" class="media-btn" title="Kirim Foto"><i class="fas fa-image"></i></button><button id="sendVideoBtn" class="media-btn" title="Kirim Video"><i class="fas fa-video"></i></button><button id="sendFileBtn" class="media-btn" title="Kirim File"><i class="fas fa-file"></i></button></div><button id="sendMsgBtn" class="btn-primary btn-small" style="width:auto; padding:8px 16px;"><i class="fas fa-paper-plane"></i> Kirim</button></div>`;
            document.getElementById('sendMsgBtn').onclick = () => { const inp = document.getElementById('chatInput'); if (inp.value.trim()) { sendMessage(targetUser.id, 'text', inp.value); inp.value = ''; renderChatContent(); } };
            document.getElementById('sendPhotoBtn').onclick = () => { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = ev => { sendMessage(targetUser.id, 'image', ev.target.result, f.name); renderChatContent(); }; r.readAsDataURL(f); } }; inp.click(); };
            document.getElementById('sendVideoBtn').onclick = () => { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'video/*'; inp.onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = ev => { sendMessage(targetUser.id, 'video', ev.target.result, f.name); renderChatContent(); }; r.readAsDataURL(f); } }; inp.click(); };
            document.getElementById('sendFileBtn').onclick = () => { const inp = document.createElement('input'); inp.type = 'file'; inp.onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = ev => { sendMessage(targetUser.id, 'file', ev.target.result, f.name); renderChatContent(); }; r.readAsDataURL(f); } }; inp.click(); };
            const msgList = document.getElementById('messageList');
            if (msgList) msgList.scrollTop = msgList.scrollHeight;
        }
    }
}

        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        if (!email || !username || !password) return showToast('<i class="fas fa-exclamation-triangle"></i> Semua field harus diisi!', true);
        if (password !== confirm) return showToast('<i class="fas fa-times-circle"></i> Password tidak sama!', true);
        if (appData.users.find(u => u.email === email)) return showToast('<i class="fas fa-envelope"></i> Email sudah terdaftar!', true);
        const saveUser = (avatar) => {
            const newUser = { id: Date.now().toString(), email, username, password, role: 'user', avatar, coins: 0, isBanned: false };

ea id="notifMessage" class="auto-expand-textarea" placeholder="Pesan Notifikasi" rows="3"></textarea><button class="btn-primary" id="sendNotifBtn"><i class="fas fa-paper-plane"></i> KIRIM NOTIFIKASI</button></div></div>`;

// ==================== EVENT LISTENERS ====================
async function attachEventListeners() {
    document.querySelectorAll('.buy-btn').forEach(btn => {
        btn.onclick = async () => {
            const product = appData.products.find(p => p.id === btn.dataset.id);
            if (product && product.stok > 0 && currentUser.coins >= product.hargaCoin) {
                currentUser.coins -= product.hargaCoin;
                product.stok--;
                const idx = appData.users.findIndex(u => u.id === currentUser.id);
                if (idx !== -1) appData.users[idx] = currentUser;
                await saveToFirebase('users', appData.users);
                await saveToFirebase('products', appData.products);
                const tid = `WANN${Date.now()}`;
                const struk = generateStruk(product, currentUser.username, tid, 1);
                if (product.fileData) {
                    const ext = product.fileName ? product.fileName.split('.').pop() : 'bin';
                    downloadFile(product.fileData, `WannShop-${product.nomor || 'unknown'}.${ext}`);
                    showToast(`<i class="fas fa-check-circle"></i> Beli ${product.nama}! File terdownload`);
                } else downloadFile(struk, `STRUK_${product.nama}.txt`, 'text/plain');
                const history = getPurchaseHistory();
                history.push({ productId: product.id, productName: product.nama, productNomor: product.nomor, price: product.hargaCoin, date: new Date().toLocaleString(), transactionId: tid, strukContent: struk, fileData: product.fileData || null, fileName: product.fileName });
                savePurchaseHistory(history);
                const pubEntry = { id: Date.now().toString(), username: currentUser.username, productName: product.nama, productNomor: product.nomor, date: new Date().toLocaleString(), transactionId: tid };
                appData.publicHistory.push(pubEntry);
                await saveToFirebase('publicHistory', appData.publicHistory);
                showToast(`<i class="fas fa-bell"></i> ${currentUser.username} membeli ${product.nama}!`);
                render();
            } else showToast(product?.stok <= 0 ? '<i class="fas fa-box-open"></i> Stok habis' : '<i class="fas fa-coins"></i> Coin tidak cukup', true);
        };
    });
    document.querySelectorAll('[data-download-struk]').forEach(btn => { btn.onclick = () => downloadFile(btn.dataset.content, `STRUK_${btn.dataset.name}.txt`, 'text/plain'); });
    document.querySelectorAll('[data-download-file]').forEach(btn => { btn.onclick = () => downloadFile(btn.dataset.file, btn.dataset.filename); });
    document.querySelectorAll('.review-btn').forEach(btn => {
        btn.onclick = () => {
            const idx = parseInt(btn.dataset.idx), history = getPurchaseHistory(), item = history[idx];
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-content"><h3><i class="fas fa-star"></i> Ulasan untuk ${item.productName}</h3><div class="stars" id="starRating">${[1,2,3,4,5].map(s => `<i class="fas fa-star star" data-star="${s}"></i>`).join('')}</div><textarea id="reviewText" class="auto-expand-textarea" rows="3" placeholder="Tulis ulasan..."></textarea><button class="btn-primary" id="submitReviewBtn"><i class="fas fa-paper-plane"></i> Kirim</button><button class="btn-primary" id="closeReviewBtn" style="background:#666;"><i class="fas fa-times"></i> Batal</button></div>`;
            document.body.appendChild(modal);
            initAutoExpandTextareas();
            let selected = 0;
            modal.querySelectorAll('.star').forEach(s => { s.onclick = () => { selected = parseInt(s.dataset.star); modal.querySelectorAll('.star').forEach(st => { if (parseInt(st.dataset.star) <= selected) st.classList.add('active'); else st.classList.remove('active'); }); }; });
            document.getElementById('submitReviewBtn').onclick = async () => {
                if (selected === 0) return showToast('<i class="fas fa-exclamation-triangle"></i> Pilih rating!', true);
                const reviewText = document.getElementById('reviewText').value.trim() || '(tanpa komentar)';
                item.rating = selected; item.review = reviewText;
                savePurchaseHistory(history);
                const pubItem = appData.publicHistory.find(p => p.transactionId === item.transactionId);
                if (pubItem) { pubItem.rating = selected; pubItem.review = reviewText; await saveToFirebase('publicHistory', appData.publicHistory); }
                const revObj = { id: Date.now().toString(), productId: item.productId, productName: item.productName, username: currentUser.username, rating: selected, review: reviewText, date: new Date().toLocaleString(), transactionId: item.transactionId };
                appData.reviews.push(revObj); await saveToFirebase('reviews', appData.reviews);
                showToast(`<i class="fas fa-check-circle"></i> Ulasan untuk ${item.productName} terkirim!`);
                modal.remove(); render();
            };
            document.getElementById('closeReviewBtn').onclick = () => modal.remove();
        };
    });
    const ubahPass = document.getElementById('ubahPasswordBtn');
    if (ubahPass) ubahPass.onclick = () => {
        const modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-content"><h3><i class="fas fa-lock"></i> Ubah Password</h3><div class="form-group"><input type="password" id="newPass" class="neon-input" placeholder="Password Baru"></div><div class="form-group"><input type="password" id="confirmPass" class="neon-input" placeholder="Konfirmasi"></div><button class="btn-primary" id="savePassBtn"><i class="fas fa-save"></i> Simpan</button><button class="btn-primary" id="closePassBtn" style="background:#666;"><i class="fas fa-times"></i> Batal</button></div>`;

            if (!np) return showToast('<i class="fas fa-exclamation-triangle"></i> Password tidak boleh kosong!', true);
            currentUser.password = np;
            const idx = appData.users.findIndex(u => u.id === currentUser.id);
            if (idx !== -1) appData.users[idx] = currentUser;
            await saveToFirebase('users', appData.users);
            showToast('<i class="fas fa-check-circle"></i> Password berhasil diubah!');
            modal.remove(); render();
        };
        document.getElementById('closePassBtn').onclick = () => modal.remove();
    };
    const changePhoto = document.getElementById('changePhotoBtn');
    if (changePhoto) changePhoto.onclick = () => {
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
        inp.onchange = e => { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = async ev => { currentUser.avatar = ev.target.result; const idx = appData.users.findIndex(u => u.id === currentUser.id); if (idx !== -1) appData.users[idx] = currentUser; await saveToFirebase('users', appData.users); showToast('<i class="fas fa-check-circle"></i> Foto berhasil diubah!'); render(); }; r.readAsDataURL(f); } };
        inp.click();
    };
    const topUpBtn = document.getElementById('topUpCoinBtn');
    if (topUpBtn) topUpBtn.onclick = () => { currentMenu = 'coin'; renderMainApp(); };
    const paySelect = document.getElementById('paymentMethod'), manualWarn = document.getElementById('manualWarning'), uploadGroup = document.getElementById('uploadGroup');
    if (paySelect) {
        paySelect.onchange = () => {
            const opt = paySelect.options[paySelect.selectedIndex], type = opt.getAttribute('data-type');
            if (type === 'manual') { manualWarn.style.display = 'block'; uploadGroup.style.display = 'none'; }
            else { manualWarn.style.display = 'none'; uploadGroup.style.display = 'block'; }
        };
        paySelect.onchange();
    }
    const submitTopUp = document.getElementById('submitTopUpBtn');
    if (submitTopUp) submitTopUp.onclick = async () => {
        const opt = document.getElementById('paymentMethod').options[document.getElementById('paymentMethod').selectedIndex];
        const type = opt.getAttribute('data-type'), link = opt.getAttribute('data-link'), coin = document.getElementById('coinPackage').value;
        if (type === 'manual') {
            if (link && confirm(`Akan dialihkan ke ${link}. Lanjutkan?`)) {
                appData.transactions.push({ id: Date.now().toString(), userId: currentUser.id, username: currentUser.username, coins: parseInt(coin), paymentMethod: opt.value, proof: 'manual_payment', status: 'pending_manual', timestamp: new Date().toISOString(), manualLink: link });
                await saveToFirebase('transactions', appData.transactions);
                showToast('<i class="fas fa-check-circle"></i> Request top up dikirim!');
                window.open(link, '_blank');
                render();
            } else showToast('<i class="fas fa-exclamation-triangle"></i> Link tidak valid!', true);
        } else {
            const proof = document.getElementById('paymentProof').files[0];
            if (!proof) return showToast('<i class="fas fa-upload"></i> Upload bukti!', true);

            r.onload = async e => {
                appData.transactions.push({ id: Date.now().toString(), userId: currentUser.id, username: currentUser.username, coins: parseInt(coin), paymentMethod: opt.value, proof: e.target.result, status: 'pending', timestamp: new Date().toISOString() });

                    const save = async (fotoUrl) => {
                        const newNomor = appData.productCounter;
                        appData.products.push({ id: Date.now().toString(), nomor: newNomor, foto: fotoUrl || 'https://via.placeholder.com/150', nama, link: '#', stok, hargaCoin: harga, fileData: eFile.target.result, fileName: file.name });

                const type = document.getElementById('payType').value, fields = document.getElementById('payFields');
                if (type === 'bank') fields.innerHTML = `<div class="form-group"><label><i class="fas fa-university"></i> Nama Bank</label><input id="bankName" class="neon-input" placeholder="Nama Bank"></div><div class="form-group"><label><i class="fas fa-credit-card"></i> Nomor Rekening</label><input id="accNum" class="neon-input" placeholder="Nomor Rekening"></div><div class="form-group"><label><i class="fas fa-user"></i> Nama Penerima</label><input id="accName" class="neon-input" placeholder="Nama Penerima"></div>`;
                else if (type === 'ewallet') fields.innerHTML = `<div class="form-group"><label><i class="fas fa-mobile-alt"></i> Platform</label><select id="platform" class="neon-select"><option value="dana">DANA</option><option value="ovo">OVO</option><option value="gopay">GOPAY</option></select></div><div class="form-group"><label><i class="fas fa-credit-card"></i> Nomor</label><input id="ewalletNum" class="neon-input" placeholder="Nomor"></div><div class="form-group"><label><i class="fas fa-user"></i> Nama Penerima</label><input id="ewalletName" class="neon-input" placeholder="Nama Penerima"></div>`;
                else fields.innerHTML = `<div class="form-group"><label><i class="fas fa-link"></i> Link Kontak</label><input id="contactLink" class="neon-input" placeholder="https://t.me/username"></div><div class="form-group"><label><i class="fas fa-user"></i> Nama Admin</label><input id="manualName" class="neon-input" placeholder="Nama Admin"></div>`;
            };
            document.getElementById('payType').onchange = updateFields;
            updateFields();
            document.getElementById('savePayBtn').onclick = async () => {
                const type = document.getElementById('payType').value, methods = appData.paymentMethods;
                let newMethod = { id: Date.now().toString(), type };
                if (type === 'bank') {
                    newMethod.bankName = document.getElementById('bankName').value;
                    newMethod.accountNumber = document.getElementById('accNum').value;
                    newMethod.accountName = document.getElementById('accName').value;
                    if (!newMethod.bankName || !newMethod.accountNumber || !newMethod.accountName) return showToast('<i class="fas fa-exclamation-triangle"></i> Lengkapi data bank!', true);
                } else if (type === 'ewallet') {
                    newMethod.platform = document.getElementById('platform').value;
                    newMethod.number = document.getElementById('ewalletNum').value;
                    newMethod.name = document.getElementById('ewalletName').value;
                    if (!newMethod.platform || !newMethod.number || !newMethod.name) return showToast('<i class="fas fa-exclamation-triangle"></i> Lengkapi data e-wallet!', true);
                } else {
                    newMethod.contactLink = document.getElementById('contactLink').value;
                    newMethod.name = document.getElementById('manualName').value || 'Admin';
                    if (!newMethod.contactLink) return showToast('<i class="fas fa-exclamation-triangle"></i> Link kontak wajib!', true);
                }
                methods.push(newMethod);
                await saveToFirebase('paymentMethods', methods);
                showToast('<i class="fas fa-check-circle"></i> Metode ditambahkan!');
                modal.remove(); render();
            };
            document.getElementById('closePayBtn').onclick = () => modal.remove();
        };
        document.querySelectorAll('.delete-payment-btn').forEach(btn => {
            btn.onclick = async () => {
                if (confirm('<i class="fas fa-trash"></i> Hapus metode ini?')) {
                    appData.paymentMethods = appData.paymentMethods.filter(m => m.id !== btn.dataset.id);
                    await saveToFirebase('paymentMethods', appData.paymentMethods);
                    showToast('<i class="fas fa-check-circle"></i> Metode dihapus!');
                    render();
                }
            };
        });
        document.querySelectorAll('.approve-btn').forEach(btn => {
            btn.onclick = async () => {
                const t = appData.transactions.find(t => t.id === btn.dataset.id);
                if (t) {
                    t.status = 'approved';
                    const user = appData.users.find(u => u.id === t.userId);
                    if (user) user.coins += t.coins;
                    await saveToFirebase('users', appData.users);
                    await saveToFirebase('transactions', appData.transactions);
                    showToast(`<i class="fas fa-check-circle"></i> Top up ${t.coins} coin untuk ${t.username} disetujui!`);
                    render();
                }
            };
        });
        document.querySelectorAll('.reject-btn').forEach(btn => {
            btn.onclick = async () => {
                const t = appData.transactions.find(t => t.id === btn.dataset.id);
                if (t) {
                    t.status = 'rejected';
                    await saveToFirebase('transactions', appData.transactions);
                    showToast(`<i class="fas fa-times-circle"></i> Top up ${t.username} ditolak!`);
                    render();
                }
            };
        });
        const sendNotifBtn = document.getElementById('sendNotifBtn');
        if (sendNotifBtn && isDeveloper()) {
            sendNotifBtn.onclick = async () => {
                const title = document.getElementById('notifTitle').value.trim();
                const message = document.getElementById('notifMessage').value.trim();
                if (!title || !message) return showToast('<i class="fas fa-exclamation-triangle"></i> Judul dan pesan wajib diisi!', true);
                await sendNotificationToAllUsers(title, message);
                document.getElementById('notifTitle').value = '';
                document.getElementById('notifMessage').value = '';
                render();
            };
        }
    }
    if (isDeveloper()) {
        document.querySelectorAll('.add-coin-btn').forEach(btn => {
            btn.onclick = async () => {
                const amt = prompt('<i class="fas fa-coins"></i> Jumlah coin:');
                if (amt && !isNaN(amt)) {
                    const user = appData.users.find(u => u.id === btn.dataset.id);
                    if (user) { user.coins += parseInt(amt); await saveToFirebase('users', appData.users); showToast(`<i class="fas fa-check-circle"></i> +${amt} coin untuk ${user.username}`); render(); }
                }
            };
        });
        document.querySelectorAll('.ban-user-btn').forEach(btn => {
            btn.onclick = async () => {
                if (confirm('<i class="fas fa-ban"></i> Ban user ini?')) {
                    const user = appData.users.find(u => u.id === btn.dataset.id);
                    if (user && user.role !== 'developer') { user.isBanned = true; await saveToFirebase('users', appData.users); showToast(`<i class="fas fa-ban"></i> ${user.username} di-ban!`); render(); }
                    else showToast('<i class="fas fa-exclamation-triangle"></i> Tidak bisa ban developer!', true);
                }
            };
        });
        document.querySelectorAll('.delete-user-btn').forEach(btn => {
            btn.onclick = async () => {
                if (confirm('<i class="fas fa-trash"></i> Hapus user ini?')) {
                    const user = appData.users.find(u => u.id === btn.dataset.id);
                    if (user && user.role !== 'developer') { appData.users = appData.users.filter(u => u.id !== btn.dataset.id); await saveToFirebase('users', appData.users); showToast(`<i class="fas fa-trash"></i> User ${user.username} dihapus!`); render(); }
                    else showToast('<i class="fas fa-exclamation-triangle"></i> Tidak bisa hapus developer!', true);
                }
            };
        });
        document.querySelectorAll('.delete-admin-btn').forEach(btn => {
            btn.onclick = async () => {
                if (confirm('<i class="fas fa-trash"></i> Hapus admin ini?')) {
                    const user = appData.users.find(u => u.id === btn.dataset.id);
                    if (user && user.role === 'admin') { user.role = 'user'; await saveToFirebase('users', appData.users); showToast(`<i class="fas fa-check-circle"></i> Admin ${user.username} dihapus!`); render(); }
                }
            };
        });
        document.querySelectorAll('.view-location-btn').forEach(btn => { btn.onclick = () => showUserLocation(btn.dataset.id); });
        const addAdmin = document.getElementById('addAdminBtn');
        if (addAdmin) addAdmin.onclick = async () => {
            const email = document.getElementById('newAdminEmail').value;
            const user = appData.users.find(u => u.email === email);
            if (user && user.role !== 'developer') {
                if (user.role === 'admin') showToast('<i class="fas fa-exclamation-triangle"></i> Sudah admin!', true);
                else { user.role = 'admin'; await saveToFirebase('users', appData.users); showToast(`<i class="fas fa-check-circle"></i> ${user.username} jadi admin!`); render(); }
            } else showToast('<i class="fas fa-exclamation-triangle"></i> User tidak ditemukan!', true);
        };
    }
}

// ==================== START APP ====================
(async () => {
    if (database) { setupFirebaseListeners(); await loadFromFirebase(); }
    if (loadUserSession()) { render(); } else { render(); }
})();
</script>
</body>
